<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Chat TTRPG GM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Chat TTRPG GM</h1>
    <p id="connection" role="status">Python APIへ接続中…</p>
    <section class="card">
      <label>シナリオ <select id="scenario"></select></label>
      <button id="start">ゲーム開始</button>
      <button id="new-game">新しいゲーム</button>
    </section>
    <section class="card">
      <h2 id="location">未開始</h2>
      <div id="history" aria-live="polite"></div>
      <form id="command-form">
        <label>プレイヤー入力 <textarea id="command" rows="3" required></textarea></label>
        <button type="submit">送信</button>
      </form>
      <p id="error" role="alert"></p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
